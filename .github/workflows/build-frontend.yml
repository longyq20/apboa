name: Build and Push Frontend Image

on:
  push:
    branches:
      - main  # 根据你的实际默认分支名称修改
    paths:
      - 'ui/**'
      - 'Dockerfile.frontend'
      - 'nginx.conf'
  workflow_dispatch:

# 【新增】赋予 GITHUB_TOKEN 推送镜像到 GHCR 的权限
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 【修改】登录到 GitHub 自己的镜像仓库 (ghcr.io)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 无需手动配置，GitHub 会自动提供

      # 【修改】推送到 ghcr.io
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          # 格式为：ghcr.io/你的github用户名(必须全小写!)/apboa-frontend:latest
          # 请把下面这行的 your_github_username 替换为你自己的 GitHub 用户名（全小写）
          tags: ghcr.io/your_github_username/apboa-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
